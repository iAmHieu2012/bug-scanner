name: Build and Publish Release

on:
  push:
    tags:
      - 'v*' # Chỉ chạy khi push tag bắt đầu bằng 'v' (ví dụ: v1.0.0)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Tải mã nguồn
      - name: Checkout Code
        uses: actions/checkout@v4

      # Bước 2: Setup Java 17 và bật Cache Gradle
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # Bước 3: Khôi phục Keystore từ file base64 trong GitHub Secrets
      - name: Decode Keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p src
          echo $ENCODED_KEYSTORE | base64 -d > src/release-key.jks

      # Bước 4: Build Release APK (Nạp trực tiếp API Keys và Passwords qua biến môi trường)
      - name: Build Release APK
        env:
          RELEASE_STORE_FILE: release-key.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          INATURALIST_API_TOKEN: ${{ secrets.INATURALIST_API_TOKEN }}
        run: |
          cd src
          chmod +x ./gradlew
          ./gradlew :composeApp:assembleRelease --no-daemon

      # Bước 5: Đăng Release bài viết và đính kèm APK
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: src/composeApp/build/outputs/apk/release/composeApp-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
