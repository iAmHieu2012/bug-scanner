name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Bước 1: Setup Java 17 và quan trọng nhất là bật Cache Gradle
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # Bước 2: Cấp quyền thực thi cho file gradlew nằm trong thư mục src/
      - name: Grant execute permission for gradlew
        run: chmod +x src/gradlew

      # Bước 3: Build Android APK (ngậm API Keys từ Secrets)
      - name: Build Debug APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          INATURALIST_API_TOKEN: ${{ secrets.INATURALIST_API_TOKEN }}
        run: cd src && ./gradlew composeApp:assembleDebug

      # Bước 4: Gom file APK vừa build ra thành Artifact để mày tải về máy
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BugScanner-Debug-APK
          path: src/composeApp/build/outputs/apk/debug/**/*.apk
          retention-days: 7 # Tự động xóa file APK trên Github sau 7 ngày để đỡ tốn dung lượng